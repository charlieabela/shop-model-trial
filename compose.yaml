include:
  - monitoring/compose.yaml

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shop
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: shop-model:${APP_VERSION:-dev}
    ports:
      - "8888:8888"
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgresql://shop:${DB_PASSWORD}@db:5432/shop
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/shop_model@champion   # move the alias, restart the API: that is a rollback
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"     # fail fast and let the API retry, so /ready reflects reality
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
    depends_on:
      db:
        condition: service_healthy
      # Session 8, Stage 19: GraphDB Free, where make kg-publish loads each release of the knowledge.
  # Every edition needs a licence file. Keep yours outside the repository and give its path in .env
  # (GRAPHDB_LICENSE). The Workbench is at http://localhost:7200.
  graphdb:
    image: ontotext/graphdb:11.3.1
    environment:
      GDB_HEAP_SIZE: 1g
    ports:
      - "7200:7200"
    volumes:
      - graphdb-data:/opt/graphdb/home
      - ${GRAPHDB_LICENSE:-./graphdb.license}:/opt/graphdb/home/conf/graphdb.license:ro

  mlflow:
        condition: service_started

  # Session 6: the tracking server and model registry, on port 5000.
  mlflow:
    build: ./mlflow
    image: shop-mlflow:3.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri postgresql://shop:${DB_PASSWORD}@db:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"   # no background job workers: they are not needed here and cost 1.5 GB
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  mlflow-artifacts:
  graphdb-data:
