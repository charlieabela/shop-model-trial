#Non-secret settings
data_path: "data/prices_v2.csv"
model_path: "models/model.joblib"
vat_rate: 0.18
seed: 42

# Training window: null trains on every row of data_path.
# Set a date (YYYY-MM-DD) to train on recent rows only.
train_start: "2026-08-03"

# The frozen holdout: the last eight weeks, cut once and never edited.
# If the file's SHA-256 no longer matches, the gate refuses to run (exit code 2).
holdout_path: "data/holdout.csv"
holdout_start: "2026-08-31"
holdout_sha256: "6f9f166ef89f71275397fdd2a8d5c5f3ce9544a79775944278824963aa072ec1"

# The quality gate: which metric blocks a release, and its threshold.
# Metrics available: accuracy, precision, recall, f1, roc_auc
gate_metric: "accuracy"
gate_threshold: 0.70

# MLflow (Session 6). MLFLOW_TRACKING_URI in .env overrides tracking_uri.
mlflow:
  tracking_uri: "http://localhost:5000"
  experiment: "shop_model"
  model_name: "shop_model"

# The language model (Session 8, Stage 19). Any OpenAI-compatible endpoint: only these lines change with the
# provider. The key, where a provider needs one, is LLM_API_KEY in .env, never here.
llm:
  base_url: "http://localhost:11434/v1"   # Ollama, running as a service on the VM
  model: "llama3.2:3b"
  timeout_seconds: 120

# GraphDB (Session 8, Stage 19): where make kg-publish loads a release.
graphdb:
  url: "http://localhost:7200"
  repository: "shop"
